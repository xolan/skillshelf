[package]
name = "skillshelf"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
gpui-kit = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
skillshelf-core = { path = "../skillshelf-core" }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
resvg = { version = "0.46", default-features = false }
tempfile = "3"
